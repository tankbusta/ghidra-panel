name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GHIDRA_VERSION: 12.1.4
  GHIDRA_BUILD_DATE: 20260921
  GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db

jobs:

  integration_jaas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: srepanel/go.mod

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ghidra_${{ env.GHIDRA_VERSION }}_PUBLIC
          key: ghidra-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_BUILD_DATE }}

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          zip="ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_BUILD_DATE}.zip"
          curl -fsSL -o "$zip" "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/$zip"
          echo "${GHIDRA_SHA256}  $zip" | sha256sum -c -
          # Only the Framework and Features jars are needed by the login module
          unzip -q "$zip" \
            "ghidra_${GHIDRA_VERSION}_PUBLIC/Ghidra/application.properties" \
            "ghidra_${GHIDRA_VERSION}_PUBLIC/Ghidra/Framework/*" \
            "ghidra_${GHIDRA_VERSION}_PUBLIC/Ghidra/Features/*"
          rm "$zip"

      - name: Run integration test
        run: make integration
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/ghidra_${{ env.GHIDRA_VERSION }}_PUBLIC
